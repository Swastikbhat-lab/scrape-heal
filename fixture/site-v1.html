<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Acme Store — Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    h1 { font-size: 1.4rem; }
    article { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; max-width: 420px; }
    .price { color: #0a7d33; font-weight: 600; }
  </style>
</head>
<body>
  <main id="catalog">
    <h1>Today's catalog</h1>

    <article class="product-card">
      <h2 class="name">Wireless Mouse</h2>
      <p class="price">$24.99</p>
    </article>
    <article class="product-card">
      <h2 class="name">Mechanical Keyboard</h2>
      <p class="price">$89.00</p>
    </article>
    <article class="product-card">
      <h2 class="name">USB-C Hub</h2>
      <p class="price">$39.50</p>
    </article>
    <article class="product-card">
      <h2 class="name">4K Monitor</h2>
      <p class="price">$299.00</p>
    </article>
  </main>
</body>
</html>
