<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Acme Store — Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    h1 { font-size: 1.4rem; }
    section { border: 1px solid #e3e3e3; border-radius: 12px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; max-width: 420px; }
    .amount { color: #0a7d33; font-weight: 600; }
    .badge { display: inline-block; font-size: 0.75rem; background: #fde68a; border-radius: 4px; padding: 0 0.35rem; margin-left: 0.4rem; }
  </style>
</head>
<body>
  <main id="catalog">
    <h1>Catalog</h1>

    <section class="item">
      <h2 class="title">Wireless Mouse</h2>
      <span class="badge">bestseller</span>
      <span class="amount">$24.99</span>
    </section>
    <section class="item">
      <h2 class="title">Mechanical Keyboard</h2>
      <span class="amount">$89.00</span>
    </section>
    <section class="item">
      <h2 class="title">USB-C Hub</h2>
      <span class="badge">new</span>
      <span class="amount">$39.50</span>
    </section>
    <section class="item">
      <h2 class="title">4K Monitor</h2>
      <span class="amount">$299.00</span>
    </section>
  </main>
</body>
</html>
