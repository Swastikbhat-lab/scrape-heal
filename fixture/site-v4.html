<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Acme Store — Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    h1 { font-size: 1.4rem; }
    .tile { border: 1px solid #ccc; border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1rem; max-width: 420px; }
    .cost { color: #b3261e; font-weight: 700; }
    .badge { display: inline-block; font-size: 0.75rem; background: #fde68a; border-radius: 4px; padding: 0 0.35rem; margin-left: 0.4rem; }
  </style>
</head>
<body>
  <main id="catalog">
    <h1>Catalog — spring refresh</h1>

    <article class="tile">
      <h3 class="title">Ergo Mouse Pro</h3>
      <span class="badge">On sale</span>
      <p class="cost">$34.99</p>
    </article>
    <article class="tile">
      <h3 class="title">TKL Mechanical Keyboard</h3>
      <span class="badge">bestseller</span>
      <p class="cost">$99.00</p>
    </article>
    <article class="tile">
      <h3 class="title">USB-C Hub 8-in-1</h3>
      <span class="badge">new</span>
      <p class="cost">$44.50</p>
    </article>
    <article class="tile">
      <h3 class="title">4K Monitor 120Hz</h3>
      <span class="badge">low stock</span>
      <p class="cost">$329.00</p>
    </article>
  </main>
</body>
</html>
