<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Acme Store — Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    h1 { font-size: 1.4rem; }
    section { border: 1px solid #e3e3e3; border-radius: 12px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; max-width: 420px; }
    .price { color: #888; font-style: italic; }
    .amount { color: #0a7d33; font-weight: 600; }
  </style>
</head>
<body>
  <main id="catalog">
    <h1>Catalog — new pricing</h1>

    <section class="item">
      <h2 class="title">Wireless Mouse</h2>
      <p class="price">Price on request</p>
      <p class="amount">$29.99</p>
    </section>
    <section class="item">
      <h2 class="title">Mechanical Keyboard</h2>
      <p class="price">Price on request</p>
      <p class="amount">$94.00</p>
    </section>
    <section class="item">
      <h2 class="title">USB-C Hub</h2>
      <p class="price">Price on request</p>
      <p class="amount">$42.50</p>
    </section>
    <section class="item">
      <h2 class="title">4K Monitor</h2>
      <p class="price">Price on request</p>
      <p class="amount">$319.00</p>
    </section>
  </main>
</body>
</html>
