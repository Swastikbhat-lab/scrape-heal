name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium (for the end-to-end heal tests)
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The repair benchmark: 15 recorded redesigns, real browser + verify
      # gate, judged on the shipped config's actual data. The rate is the
      # regression floor — 0.9 leaves room to add a deliberately-failing
      # scenario (the corpus's whole point) while still catching any change
      # that slips the loop. Runs once per push, not per matrix entry.
      - name: Repair benchmark (rate gate)
        if: matrix.node-version == 22
        run: npm run benchmark -- --min-rate 0.9
