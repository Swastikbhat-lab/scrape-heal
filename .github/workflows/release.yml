name: Release

# Publish to npm when a version tag (v0.1.1, v0.2.0, …) is pushed.
#
# One-time setup: add an npm access token as the `NPM_TOKEN` repo secret
# (Settings → Secrets and variables → Actions → New repository secret).
# Then a release is literally:
#
#   npm version patch -m "v%s"
#   git push --tags
#
# `npm publish` runs prepublishOnly (typecheck + tests + build) again as the
# final gate before bytes leave the machine — the explicit steps below exist
# so a failure shows up with a clear step name first.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "v$PKG" ]; then
            echo "tag $TAG does not match package.json version v$PKG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
